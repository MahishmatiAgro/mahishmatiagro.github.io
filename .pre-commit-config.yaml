# .pre-commit-config.yaml - checks and formatting for the website
# Setup once:   npm ci && pre-commit install
# Run on all:   pre-commit run --all-files
# Update hooks: pre-commit autoupdate

# Used as supplied: three.js library files and the 3D jar models
exclude: "^(node_modules/|view-product/jar/js/vendor/|view-product/jar/models/)"

repos:
  # ===========================================================================
  # GENERAL FILE CHECKS
  # ===========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-json
      - id: check-yaml

  # ===========================================================================
  # HTML, CSS, JS, JSON, YAML, MARKDOWN
  # ===========================================================================
  # The repo's own Prettier (package.json, .prettierrc.json, .prettierignore), so
  # pre-commit formats exactly like the "Check formatting" step of the deploy.
  - repo: local
    hooks:
      - id: prettier
        name: Prettier (repo version and settings)
        language: system
        entry: npx --no-install prettier --write --ignore-unknown
        types: [text]
        require_serial: true
